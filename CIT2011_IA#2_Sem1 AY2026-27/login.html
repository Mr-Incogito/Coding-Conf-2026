<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | Coding Conf 2026</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header class="site-header">
        <a href="index.html">
            <img src="assets/images/logo-full.svg" alt="Coding Conf logo">
        </a>
    </header>

    <main class="registration-page">

        <section class="registration-heading">
            <h1>Your Journey to Coding Conf 2026 Starts Here!</h1>

            <p>Secure your spot at the biggest coding conference of the year.</p>
        </section>

        <section class="registration-container">

            <h2>Register for Coding Conf</h2>

            <form id="registrationForm" novalidate>

                <div class="form-group">
                    <label for="fullName">Full Name</label>

                    <input
                        type="text"
                        id="fullName"
                        name="fullName"
                        placeholder="John Doe"
                        autocomplete="name"
                    >

                    <small class="error-message" id="nameError"></small>
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="example@email.com"
                        autocomplete="email"
                    >

                    <small class="error-message" id="emailError"></small>
                </div>

                <div class="form-group">
                    <label for="github">GitHub Username</label>

                    <input
                        type="text"
                        id="github"
                        name="github"
                        placeholder="@username"
                    >

                    <small class="error-message" id="githubError"></small>
                </div>

                <div class="form-group">
                    <label for="avatar">Upload Your Avatar</label>

                    <div class="upload-area">
                        <img
                            src="assets/images/icon-upload.svg"
                            alt=""
                            class="upload-icon"
                        >

                        <p>Drag and drop or click to upload</p>

                        <input
                            type="file"
                            id="avatar"
                            name="avatar"
                            accept=".jpg,.jpeg,.png,image/jpeg,image/png"
                        >
                    </div>

                    <small class="upload-hint">
                        Upload a JPG or PNG image (maximum size: 500KB).
                    </small>

                    <small class="error-message" id="avatarError"></small>
                </div>

                <button type="submit" class="register-button">
                    Generate My Ticket
                </button>

            </form>

        </section>

    </main>

    <footer class="site-footer">
        <p>&copy; 2026 Coding Conf. All rights reserved.</p>
    </footer>

    <script src="js/validation.js"></script>

</body>
</html>
