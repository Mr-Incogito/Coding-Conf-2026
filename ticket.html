
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Your Coding Conf 2026 registration ticket.">
    <title>Your Ticket | Coding Conf 2026</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" href="assets/images/favicon-32x32.png">
</head>

<body>

    <header class="site-header">
        <a href="index.html" aria-label="Coding Conf home">
            <img src="assets/images/logo-full.svg" alt="Coding Conf logo">
        </a>
    </header>

    <main class="ticket-page">

        <section class="ticket-heading">
            <h1 id="confirmationHeading">
                Congrats! Your ticket is ready.
            </h1>

            <p>
                Your ticket has been generated successfully.
                Keep this page as confirmation of your registration!
            </p>
        </section>

        <section class="ticket-container">

            <div class="ticket-card">

                <div class="ticket-top">

                    <div class="ticket-brand">
                        <img src="assets/images/logo-mark.svg" alt="">

                        <div>
                            <h2>Coding Conf</h2>
                            <p>2026</p>
                        </div>
                    </div>

                    <p class="ticket-number" id="ticketNumber">#00000</p>

                </div>

                <div class="ticket-event-details">
                    <p>October 26, 2026 / Papine, Kgn</p>
                </div>

                <div class="ticket-attendee">

                    <img
                        src="assets/images/image-avatar.jpg"
                        alt="Your uploaded avatar"
                        id="ticketAvatar"
                        class="ticket-avatar"
                    >

                    <div class="attendee-information">

                        <h2 id="ticketName">Your Name</h2>

                        <a
                            href="#"
                            id="ticketGithub"
                            target="_blank"
                            rel="noopener noreferrer"
                        >
                            @username
                        </a>

                    </div>

                </div>

            </div>

            <a href="index.html" class="register-button ticket-home-button">
                Back to Home
            </a>

        </section>

    </main>

    <footer class="site-footer">
        <p>&copy; 2026 Coding Conf. All rights reserved.</p>
    </footer>

    <script src="js/ticket.js"></script>

</body>
</html>
